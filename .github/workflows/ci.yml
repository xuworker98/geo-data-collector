name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  offline-selftest:
    name: 离线自检（不联网、不需要 Key）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 版本一致性（VERSION ↔ SKILL.md）
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V"
          grep -q "^version: $V$" SKILL.md
          grep -q "version-$V-" README.md || true

      - name: 语法编译检查
        run: python -m compileall -q scripts

      - name: 能力层自检（坐标算法）
        run: python scripts/gc_common.py

      - name: 质检模块自检（12 项）
        run: python scripts/qc.py

      - name: 采集模块自检（网格 / 断点 / 计划）
        run: python scripts/collect.py --selftest

      - name: 输出模块自检（模板生成）
        run: |
          python scripts/export.py --template /tmp/模板_自检.xlsx
          test -s /tmp/模板_自检.xlsx

      - name: 输出链路冒烟（六表 + 质检报告）
        run: |
          python scripts/export.py --demo
          test -f output/示例_六表输出.xlsx
          test -f output/示例_质检报告.md
          grep -q "乡镇表" output/示例_质检报告.md || true
